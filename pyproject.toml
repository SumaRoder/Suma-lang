[project]
name = "suma-lang"
version = "0.2.0"
description = "A statically-typed programming language with Result-based error handling"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "SumaRoder", email = "1493813167@qq.com" },
]
keywords = ["programming-language", "compiler", "vm", "bytecode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
lint = [
    "ruff>=0.6.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
suma = "suma_lang.cli:main"

[project.urls]
Homepage = "https://github.com/SumaRoder/suma-lang"
Repository = "https://github.com/SumaRoder/suma-lang"
Issues = "https://github.com/SumaRoder/suma-lang/issues"
Documentation = "https://SumaRoder.github.io/suma-lang/"
QQ = "https://qm.qq.com/q/glXT2rJOa4" # 1493813167
"QQ Group" = "https://qm.qq.com/q/SnY4eGn7iu" # 1104802947

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suma_lang"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Benchmarks are skipped from the default suite — they're slow (fib(30) alone
# is ~17s) and have their own CI job that runs them with measurements. To run
# them locally, pass `--benchmark-enable --benchmark-only`.
addopts = "--benchmark-skip"
markers = [
    "benchmark: marks a benchmark test (run via the `benchmarks` CI job)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/suma_lang/mid/ir/__init__.py" = ["F401", "F403", "I001"]

[tool.pyright]
include = ["src", "main.py"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportUnsupportedDunderAll = "none"
# Selectively enable strict-mode rules that we've already cleaned up.
# The remaining strict-only checks (Unknown* family, PrivateUsage) fire >800
# warnings; they're tracked as future work but are not gated today.
reportUnnecessaryComparison = "error"
reportMissingParameterType = "error"
reportUnusedFunction = "error"

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=5.0",
    "pip-audit>=2.0"
]
