[project]
name = "suma-lang"
version = "0.1.0"
description = "A statically-typed programming language with Result-based error handling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Suma-lang Contributors" },
]
keywords = ["programming-language", "compiler", "vm", "bytecode"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.scripts]
suma = "src.cli:main"

[project.urls]
Homepage = "https://github.com/suma-lang/suma-lang"
Repository = "https://github.com/suma-lang/suma-lang"
Issues = "https://github.com/suma-lang/suma-lang/issues"
Documentation = "https://github.com/suma-lang/suma-lang/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mid/ir/__init__.py" = ["F401", "F403", "I001"]
"src/mid/ir/codegen.py" = ["F403", "F405"]
"src/mid/ir/lower.py" = ["F403", "F405"]
"src/mid/ir/optimizer.py" = ["F403", "F405"]

[tool.pyright]
include = ["src", "main.py"]
typeCheckingMode = "basic"
reportOperatorIssue = "none"
reportAttributeAccessIssue = "none"
reportOptionalOperand = "none"
reportFunctionMemberAccess = "none"
reportRedeclaration = "none"
reportCallIssue = "none"
reportArgumentType = "none"
reportGeneralTypeIssues = "none"
reportUnsupportedDunderAll = "none"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
]
